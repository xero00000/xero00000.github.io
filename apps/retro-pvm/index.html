<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro PVM Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
</head>

<!-- == VERTEX SHADER == -->
<script type="x-shader/x-vertex" id="vert-shader">
    #version 300 es
    in vec4 a_position;
    out vec2 v_uv;
    void main() {
        gl_Position = a_position;
        v_uv = a_position.xy * 0.5 + 0.5;
    }
</script>

<!-- == PHOSPHOR / SIGNAL SHADER == -->
<script type="x-shader/x-fragment" id="frag-phosphor">
    #version 300 es
    precision highp float;

    uniform sampler2D u_video;
    uniform sampler2D u_persistence;
    uniform float u_time;
    uniform float u_decay;
    uniform float u_beam_glow;
    uniform float u_beam_progress;
    uniform bool  u_slow_mo;
    uniform bool  u_crop_43;
    uniform vec2  u_video_res;

    // Signal
    uniform float u_signal_strength;
    uniform float u_ghosting;
    uniform float u_tracking_error;
    uniform int   u_source_mode;    // 0=Video/Image, 1=Snow, 2=TestPattern
    uniform int   u_signal_type;    // 0=RGB, 1=S-Video, 2=Composite, 3=RF
    uniform float u_compression;
    uniform bool  u_vcr_mode;

    // NEW uniforms
    uniform float u_jitter;           // H-sync instability 0.0-0.005
    uniform int   u_test_pattern_type; // 0=SMPTE, 1=Multiburst, 2=Crosshatch, 3=Grayscale

    in vec2 v_uv;
    out vec4 outColor;

    const float PI = 3.14159265359;

    float random(vec2 st) { return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123); }
    float random(float t)  { return random(vec2(t, t * 1.234)); }

    // NTSC
    vec3 rgb2yiq(vec3 c) {
        return vec3(
             0.299*c.r + 0.587*c.g + 0.114*c.b,
             0.596*c.r - 0.274*c.g - 0.322*c.b,
             0.211*c.r - 0.523*c.g + 0.312*c.b);
    }
    vec3 yiq2rgb(vec3 c) {
        return vec3(
            c.x + 0.956*c.y + 0.621*c.z,
            c.x - 0.272*c.y - 0.647*c.z,
            c.x - 1.106*c.y + 1.703*c.z);
    }

    // ---- Test Patterns ----
    vec3 smpte(vec2 uv) {
        if (uv.y < 0.25) {
            if (uv.x < 1.0/6.0) return vec3(0.0,0.0,1.0);
            if (uv.x < 2.0/6.0) return vec3(0.0);
            if (uv.x < 3.0/6.0) return vec3(1.0,0.0,1.0);
            if (uv.x < 4.0/6.0) return vec3(0.0);
            if (uv.x < 5.0/6.0) return vec3(0.0,1.0,1.0);
            return vec3(0.0);
        }
        if (uv.y < 0.33) {
            if (uv.x < 1.0/6.0) return vec3(0.0,0.0,1.0);
            if (uv.x < 5.0/6.0) return vec3(0.1);
            return vec3(0.0);
        }
        float bw = 1.0/7.0;
        if (uv.x < bw)       return vec3(0.75);
        if (uv.x < bw*2.0)   return vec3(0.75,0.75,0.0);
        if (uv.x < bw*3.0)   return vec3(0.0,0.75,0.75);
        if (uv.x < bw*4.0)   return vec3(0.0,0.75,0.0);
        if (uv.x < bw*5.0)   return vec3(0.75,0.0,0.75);
        if (uv.x < bw*6.0)   return vec3(0.75,0.0,0.0);
        return vec3(0.0,0.0,0.75);
    }

    vec3 multiburst(vec2 uv) {
        float seg = floor(uv.x * 6.0);
        float lx  = fract(uv.x * 6.0);
        float freq = pow(2.0, seg + 1.0);
        float wave = sin(lx * freq * PI * 4.0) * 0.5 + 0.5;
        if (uv.y < 0.1)  return vec3(seg / 5.0); // label strip
        if (uv.y > 0.9)  return vec3(0.0);
        return vec3(wave);
    }

    vec3 crosshatch(vec2 uv) {
        float gx = step(0.96, fract(uv.x * 12.0));
        float gy = step(0.96, fract(uv.y *  9.0));
        float cx = step(abs(uv.x - 0.5), 0.004);
        float cy = step(abs(uv.y - 0.5), 0.004);
        return vec3(min(1.0, gx + gy + cx + cy));
    }

    vec3 grayscaleRamp(vec2 uv) {
        float ramp = uv.x;
        float stepped = floor(ramp * 16.0) / 16.0;
        return vec3(uv.y < 0.5 ? ramp : stepped);
    }

    vec3 testPattern(vec2 uv) {
        if (u_test_pattern_type == 1) return multiburst(uv);
        if (u_test_pattern_type == 2) return crosshatch(uv);
        if (u_test_pattern_type == 3) return grayscaleRamp(uv);
        return smpte(uv);
    }

    // Compression block quantise
    vec4 getVideo(vec2 uv) {
        if (u_compression < 0.01) return texture(u_video, uv);
        float amt   = (u_compression - 0.01) / 0.89;
        float bsize = mix(512.0, 32.0, amt);
        return texture(u_video, floor(uv * bsize) / bsize);
    }

    void main() {
        vec2 uv = v_uv;
        vec4 history = texture(u_persistence, v_uv);
        vec4 decayed  = history * u_decay;

        float beamHeight = u_slow_mo ? 0.06 : 1.0;
        float distToBeam = abs((1.0 - uv.y) - u_beam_progress);
        float hit = smoothstep(beamHeight, 0.0, distToBeam);
        if (!u_slow_mo) hit = 1.0;

        float noise = random(uv * u_time);
        vec4 newItem;

        if (u_source_mode == 1) {                         // Snow
            newItem = vec4(vec3(noise), 1.0);
        } else if (u_source_mode == 2) {                  // Test Pattern
            newItem = vec4(testPattern(uv), 1.0);
        } else {                                           // Video / Image
            vec2 videoUV = uv;

            // 4:3 crop
            if (u_crop_43 && u_video_res.y > 0.0) {
                float va = u_video_res.x / u_video_res.y;
                float ta = 4.0 / 3.0;
                if (va > ta) { float nw = ta/va; videoUV.x = videoUV.x*nw + (1.0-nw)*0.5; }
                else         { float nh = va/ta; videoUV.y = videoUV.y*nh + (1.0-nh)*0.5; }
            }

            // H-sync jitter
            if (u_jitter > 0.0) {
                videoUV.x += u_jitter * (random(vec2(videoUV.y * 1234.5, u_time)) * 2.0 - 1.0);
            }

            vec2 pixel = 1.0 / u_video_res;

            // Signal type
            if (u_signal_type == 0) {
                newItem = getVideo(videoUV);
            } else {
                vec3 yiq = rgb2yiq(getVideo(videoUV).rgb);

                if (u_signal_type == 1) { // S-Video
                    yiq.y = 0.5*(rgb2yiq(getVideo(videoUV - pixel).rgb).y + rgb2yiq(getVideo(videoUV + pixel).rgb).y);
                    yiq.z = 0.5*(rgb2yiq(getVideo(videoUV - pixel).rgb).z + rgb2yiq(getVideo(videoUV + pixel).rgb).z);
                }

                if (u_signal_type == 2 || u_signal_type == 3) { // Composite / RF
                    yiq.y = 0.25*(rgb2yiq(getVideo(videoUV - pixel*2.0).rgb).y + 2.0*yiq.y + rgb2yiq(getVideo(videoUV + pixel*2.0).rgb).y);
                    yiq.z = 0.25*(rgb2yiq(getVideo(videoUV - pixel*2.0).rgb).z + 2.0*yiq.z + rgb2yiq(getVideo(videoUV + pixel*2.0).rgb).z);
                    // Dot crawl
                    float phase = fract(videoUV.x * u_video_res.x * 0.5 + u_time * 3.7699);
                    float dc = (sin(phase*PI*2.0)*0.5+0.5) * 0.1;
                    yiq.x += dc * (yiq.x - 0.5);
                }

                // RF interference bars
                if (u_signal_type == 3) {
                    float rf_t  = u_time * 0.28;
                    float band  = smoothstep(0.4, 0.5, fract(uv.y * 3.0 + rf_t))
                                * smoothstep(0.6, 0.5, fract(uv.y * 3.0 + rf_t));
                    float rfx   = band * (1.0 - u_signal_strength) * 2.5;
                    yiq.x      += rfx * 0.4;
                    yiq.y      += rfx * 0.6;
                }

                newItem = vec4(yiq2rgb(yiq), 1.0);
            }

            // Ghosting
            vec4 ghost = getVideo(videoUV - vec2(u_ghosting, 0.0)) * 0.5;
            newItem = newItem*(1.0 - u_ghosting*0.5) + ghost*u_ghosting;

            // Signal noise
            float sn = (1.0 - u_signal_strength) * noise * 0.8;
            newItem.rgb += sn;

            // Tracking error
            if (u_tracking_error > 0.0) {
                float ty    = fract(u_time * 0.5);
                float tband = smoothstep(0.0, 0.01, abs(uv.y - ty) - 0.1)
                            * smoothstep(0.0, 0.01, abs(uv.y - ty));
                float tn    = random(vec2(uv.x, u_time)) * 2.0 - 1.0;
                newItem.rgb += tband * tn * u_tracking_error;
                newItem.rgb *= 1.0 - tband * 0.5 * u_tracking_error;
            }

            // VCR head switching
            if (u_vcr_mode && videoUV.y < 0.02) {
                newItem.rgb *= 0.5;
                newItem.rgb += random(vec2(videoUV.x, u_time)) * 0.5;
            }
        }

        vec4 beamColor = newItem * (u_beam_glow + (noise * 0.08));
        outColor = mix(decayed, max(decayed, beamColor), hit);
        outColor.a = 1.0;
    }
</script>

<!-- == DISPLAY / POST-PROCESS SHADER == -->
<script type="x-shader/x-fragment" id="frag-display">
    #version 300 es
    precision highp float;

    uniform sampler2D u_texture;
    uniform sampler2D u_burn_in_tex;
    uniform vec2  u_resolution;
    uniform float u_time;

    uniform float u_curvature;
    uniform int   u_frame;
    uniform float u_bloom;

    uniform float u_brightness;
    uniform float u_contrast;
    uniform float u_saturation;
    uniform float u_tint;
    uniform float u_sharpness;

    uniform bool  u_res_240p;
    uniform bool  u_interlace;
    uniform float u_convergence;
    uniform int   u_phosphor_mask;

    uniform bool  u_power_on;
    uniform float u_power_on_time;    // absolute time of power toggle
    uniform bool  u_degauss_active;
    uniform float u_degauss_time;

    uniform float u_v_hold;
    uniform bool  u_weak_red;
    uniform bool  u_weak_green;
    uniform bool  u_weak_blue;
    uniform float u_burn_in_amount;

    // NEW
    uniform float u_warmup_t; // 0.0 = cold, 1.0 = fully warm (~30s)

    in vec2 v_uv;
    out vec4 outColor;

    const float PI = 3.14159265359;

    vec3 rgb2hsv(vec3 c) {
        vec4 K = vec4(0.0,-1.0/3.0,2.0/3.0,-1.0);
        vec4 p = mix(vec4(c.bg,K.wz), vec4(c.gb,K.xy), step(c.b,c.g));
        vec4 q = mix(vec4(p.xyw,c.r), vec4(c.r,p.yzx), step(p.x,c.r));
        float d = q.x - min(q.w,q.y);
        float e = 1.0e-10;
        return vec3(abs(q.z+(q.w-q.y)/(6.0*d+e)), d/(q.x+e), q.x);
    }
    vec3 hsv2rgb(vec3 c) {
        vec4 K = vec4(1.0,2.0/3.0,1.0/3.0,3.0);
        vec3 p = abs(fract(c.xxx+K.xyz)*6.0 - K.www);
        return c.z * mix(K.xxx, clamp(p-K.xxx,0.0,1.0), c.y);
    }

    vec2 curve(vec2 uv) {
        uv = (uv-0.5)*2.0;
        uv.x *= 1.0 + pow(abs(uv.y)*u_curvature, 2.1);
        uv.y *= 1.0 + pow(abs(uv.x)*u_curvature, 2.1);
        uv *= 0.98;
        return uv*0.5 + 0.5;
    }

    vec3 apertureGrille(vec3 col, vec2 uv, float scale) {
        float x = uv.x * scale * 3.0;
        float m = mod(x, 3.0);
        if (m < 1.0) col.r *= 1.2; else if (m < 2.0) col.g *= 1.2; else col.b *= 1.2;
        return col * (0.8 + 0.2*sin(x*PI*2.0));
    }
    vec3 shadowMask(vec3 col, vec2 uv, float scale) {
        float y = uv.y*scale, x = uv.x*scale;
        return col * vec3(0.9+0.1*sin(y*0.5+x), 0.9+0.1*sin(y), 0.9+0.1*sin(y*0.5-x));
    }
    vec3 slotMask(vec3 col, vec2 uv, float scale) {
        float x = uv.x*scale, y = uv.y*scale;
        col.r *= 0.9+0.1*sin(x*PI*2.0);
        col.g *= 0.9+0.1*sin(x*PI*2.0+(PI*2.0/3.0));
        col.b *= 0.9+0.1*sin(x*PI*2.0+(PI*4.0/3.0));
        return col * vec3(0.9+0.1*sin(x+y), 0.9+0.1*sin(x-y), 0.9+0.1*sin(y*2.0))
                   * (0.8+0.2*sin(y*PI*2.0));
    }

    void main() {
        vec2 uv = v_uv;

        // Degauss wobble
        if (u_degauss_active) {
            float dt = clamp(u_degauss_time, 0.0, 1.0);
            float wobble = sin(dt*PI*8.0) * pow(1.0-dt, 3.0) * 0.05;
            uv.x += sin(uv.y*10.0 + u_time*2.0) * wobble;
            uv.y += cos(uv.x*10.0 + u_time*2.0) * wobble;
        }

        // V-Hold
        uv.y = fract(uv.y + u_time*(u_v_hold-0.5)*0.5);

        // Curvature
        uv = curve(uv);
        if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) {
            outColor = vec4(0.0,0.0,0.0,1.0); return;
        }

        // 240p
        if (u_res_240p) uv.y = floor(uv.y*240.0)/240.0;

        // Sharpening
        vec2 texel = 1.0 / u_resolution;
        vec3 col = texture(u_texture, uv).rgb;
        if (u_sharpness > 0.0) {
            vec3 nb = (texture(u_texture, uv-vec2(0.0,texel.y)).rgb
                     + texture(u_texture, uv-vec2(texel.x,0.0)).rgb
                     + texture(u_texture, uv+vec2(texel.x,0.0)).rgb
                     + texture(u_texture, uv+vec2(0.0,texel.y)).rgb) * 0.25;
            col = mix(nb, col, 1.0+u_sharpness);
        }

        // Convergence (per-channel shift)
        vec2 dist = (uv-0.5)*u_convergence*20.0;
        col.r = texture(u_texture, uv+dist*0.5).r;
        col.b = texture(u_texture, uv-dist*0.5).b;

        // Scanlines
        float scanCount = u_res_240p ? 240.0 : u_resolution.y*0.8;
        float scanInt   = u_res_240p ? 0.45  : 0.25;
        col *= 1.0 - (sin(uv.y*scanCount*6.283185)*0.5+0.5) * scanInt;

        // Interlacing
        if (u_interlace) {
            float line = mod(floor(v_uv.y*u_resolution.y), 2.0);
            if (line != mod(float(u_frame), 2.0)) col *= 0.5;
        }

        // Phosphor mask
        float ms = u_resolution.x * 0.25;
        if      (u_phosphor_mask == 1) col = apertureGrille(col, uv, ms);
        else if (u_phosphor_mask == 2) col = shadowMask(col, uv, ms*1.5);
        else if (u_phosphor_mask == 3) col = slotMask(col, uv, ms);

        // Vignette
        float vig = uv.x*uv.y*(1.0-uv.x)*(1.0-uv.y)*16.0;
        col *= pow(vig, 0.15);

        // Tint / hue
        vec3 hsv = rgb2hsv(col);
        hsv.x = fract(hsv.x + u_tint);
        col = hsv2rgb(hsv);

        // Saturation + warmup
        float warmup_sat = mix(0.25, 1.0, u_warmup_t);
        float gray = dot(col, vec3(0.2126,0.7152,0.0722));
        col = mix(vec3(gray), col, u_saturation * warmup_sat);

        // Contrast
        col = (col - 0.5)*u_contrast + 0.5;

        // Brightness + warmup ramp
        float warmup_br = mix(0.45, 1.0, u_warmup_t);
        col *= u_brightness * warmup_br;

        // Bloom
        col += max(vec3(0.0), col-0.5) * u_bloom * 2.0;
        col *= 1.3;

        // Hardware faults
        if (u_weak_red)   col.r *= 0.5;
        if (u_weak_green) col.g *= 0.5;
        if (u_weak_blue)  col.b *= 0.5;

        // Burn-in
        if (u_burn_in_amount > 0.0) {
            vec4 burn = texture(u_burn_in_tex, v_uv);
            col += burn.rgb * u_burn_in_amount * 0.5;
        }

        // Power on/off animation
        // now_time = elapsed seconds since last power toggle
        float now_time = u_time - u_power_on_time;

        if (u_power_on) {
            // Fade in over 0.5s
            float pt  = smoothstep(0.0, 0.5, now_time);
            // White dot: pops in at start then fades
            float dot_i = (1.0 - smoothstep(0.0, 0.3, now_time)) * smoothstep(0.0, 0.08, now_time);
            float dot_r = 0.05 + pow(1.0 - smoothstep(0.0, 0.5, now_time), 2.0) * 2.0;
            float dot   = (1.0 - smoothstep(0.0, dot_r, length(v_uv-0.5))) * dot_i;
            col = col * pt;
            col = mix(col, vec3(1.0), dot);
        } else {
            // --- Raster shutdown ---
            // 0.00-0.18s: image squishes to a horizontal line
            float collapse  = smoothstep(0.0, 0.18, now_time);
            float raster_h  = mix(0.5, 0.006, collapse);       // half-height of visible zone
            float y_dist    = abs(v_uv.y - 0.5);
            float in_raster = step(y_dist, raster_h);

            // Image fades as it squishes
            float img_alpha = (1.0 - smoothstep(0.0, 0.18, now_time)) * in_raster;
            col *= img_alpha;

            // Bright horizontal glow line
            float glow_mask = exp(-y_dist * 300.0 * (1.0 - collapse + 0.01));
            float glow_t    = smoothstep(0.12, 0.2, now_time) * (1.0 - smoothstep(0.35, 0.55, now_time));
            col += vec3(glow_mask * glow_t * 3.0);

            // White dot appears after raster collapses
            float dot_i = smoothstep(0.38, 0.48, now_time) * (1.0 - smoothstep(0.52, 0.72, now_time)) * 1.6;
            float dot   = 1.0 - smoothstep(0.0, 0.038, length(v_uv - vec2(0.5)));
            col += vec3(dot * dot_i);
        }

        outColor = vec4(col, 1.0);
    }
</script>

<body class="bg-neutral-900 text-neutral-300 flex items-center justify-center w-screen h-screen p-4 lg:p-8">

<div id="tv-set" class="w-full h-full max-w-7xl max-h-[1000px] flex flex-col lg:flex-row gap-4 lg:gap-6 transition-opacity duration-1000">

    <!-- Screen -->
    <div id="screen-container" class="flex-initial lg:flex-1 flex flex-col bg-black rounded-xl shadow-2xl overflow-hidden border-2 border-neutral-700">

        <div id="screen-viewport" class="flex-1 w-full relative bg-black aspect-[4/3] shadow-inner overflow-hidden">
            <video id="source-video" loop playsinline crossorigin="anonymous" class="w-full h-full object-contain hidden"></video>
            <canvas id="glcanvas" class="w-full h-full"></canvas>
            <div id="glare-overlay"></div>
            <!-- OSD -->
            <div id="osd-container">
                <h2 id="osd-title" class="osd-menu-title">Video</h2>
                <div id="osd-items"></div>
            </div>
        </div>

        <!-- Transport bar -->
        <div id="transport-bar" class="w-full p-3 bg-neutral-800 border-t-2 border-neutral-700 flex items-center gap-4">
            <button id="play-pause-btn" class="text-amber-400 hover:text-amber-300 transition disabled:opacity-30" disabled>
                <svg id="play-icon"  class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg id="pause-icon" class="w-8 h-8 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <div class="flex-1 flex items-center gap-3 font-mono text-xs text-amber-400">
                <span id="current-time" class="w-12 text-center">00:00</span>
                <input type="range" id="timeline-range" min="0" max="100" value="0" step="0.1" class="flex-1" disabled>
                <span id="duration-time" class="w-12 text-center">00:00</span>
            </div>
            <div class="flex items-center gap-2 w-28">
                <svg class="w-5 h-5 text-amber-400/70 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
                <input type="range" id="volume-range" min="0" max="1" step="0.05" value="1">
            </div>
            <button id="fullscreen-btn"     class="text-amber-400 hover:text-amber-300 transition ml-2" title="Theatre Mode">
                <svg id="fs-enter-icon"     class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
                <svg id="fs-exit-icon"      class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path d="M21 15v6h-6M3 9V3h6M15 21l6-6M9 3l-6 6"/></svg>
            </button>
            <button id="crt-fullscreen-btn" class="text-amber-400 hover:text-amber-300 transition ml-2" title="CRT-Only Fullscreen">
                <svg id="crt-fs-enter-icon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path d="M10 4H5a1 1 0 0 0-1 1v5M14 20h5a1 1 0 0 0 1-1v-5M4 14v5a1 1 0 0 0 1 1h5M20 10V5a1 1 0 0 0-1-1h-5"/></svg>
                <svg id="crt-fs-exit-icon"  class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path d="M4 14h5a1 1 0 0 0 1-1v-5M20 10h-5a1 1 0 0 0-1 1v5M10 4v5a1 1 0 0 0 1 1h5M14 20v-5a1 1 0 0 0-1-1h-5"/></svg>
            </button>
            <!-- Overlay Mode button -->
            <button id="overlay-btn" class="text-amber-400 hover:text-amber-300 transition ml-2" title="Screen Overlay Mode (O)">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <rect x="2" y="3" width="20" height="14" rx="2"/>
                    <path d="M8 21h8M12 17v4"/>
                    <path d="M2 9h20" stroke-dasharray="2 2"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Control Panel -->
    <div id="control-panel" class="flex-1 lg:flex-initial w-full lg:w-80 xl:w-96 bg-neutral-800 rounded-xl shadow-2xl p-5 flex-shrink-0 border-2 border-neutral-700 flex flex-col gap-4 overflow-y-auto">

        <!-- Status -->
        <div class="bg-black/70 rounded p-3 text-center border border-neutral-700 shadow-inner flex items-center justify-center gap-2">
            <span id="status-text" class="text-sm font-mono text-amber-500 tracking-wider">POWER OFF</span>
            <span id="hz-badge"></span>
        </div>

        <!-- Power & Presets -->
        <div class="panel-section">
            <div class="flex gap-2">
                <button id="power-btn" class="btn-icon w-3/4 flex items-center justify-center gap-2" style="background:rgba(153,27,27,0.8);border-color:rgba(220,38,38,0.5)" title="Toggle Power">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.636 5.636a9 9 0 1012.728 0M12 3v9"/></svg>
                    <span class="font-mono text-lg">POWER</span>
                </button>
                <button id="menu-btn" class="btn-icon w-1/4" title="OSD Menu" disabled>
                    <svg class="w-6 h-6 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
            </div>
            <div class="control-group mt-3 pt-3 border-t border-neutral-700/50">
                <label class="control-label">Load Preset</label>
                <select id="preset-select" class="btn w-full text-left px-3">
                    <option value="">-- Select Preset --</option>
                </select>
            </div>
            <div class="control-group mt-2">
                <label class="control-label">Save Preset As</label>
                <div class="flex gap-2">
                    <input type="text" id="preset-name" placeholder="Preset Name..." class="flex-1 bg-black/50 border border-neutral-700 rounded px-3 py-2 text-sm font-mono text-amber-400 focus:outline-none focus:border-amber-500 placeholder:text-neutral-500">
                    <button id="save-preset-btn" class="btn btn-sm px-3">SAVE</button>
                </div>
            </div>
            <div class="flex gap-2 mt-2">
                <button id="export-preset-btn" class="btn btn-sm flex-1" disabled>EXPORT</button>
                <label  class="btn btn-sm flex-1 cursor-pointer text-center">
                    <input type="file" id="import-preset-file" accept=".json" class="hidden">IMPORT
                </label>
            </div>
        </div>

        <!-- Signal Input -->
        <div class="panel-section">
            <h2 class="panel-header">Signal Input</h2>
            <div class="grid grid-cols-4 gap-2 mb-3">
                <label class="btn-icon text-center cursor-pointer" title="Open Video File">
                    <input type="file" id="video-uploader" accept="video/*" class="hidden" disabled>
                    <svg class="w-5 h-5 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                </label>
                <label class="btn-icon text-center cursor-pointer" title="Open Image / GIF">
                    <input type="file" id="image-uploader" accept="image/*" class="hidden" disabled>
                    <svg class="w-5 h-5 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                </label>
                <button id="screen-share-btn" class="btn-icon" title="Share Screen" disabled>
                    <svg class="w-5 h-5 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                </button>
                <button id="webcam-btn" class="btn-icon" title="Use Webcam" disabled>
                    <svg class="w-5 h-5 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                </button>
            </div>
            <div class="flex gap-2">
                <input type="text" id="url-input" placeholder="Direct .mp4/.webm URL..." class="flex-1 bg-black/50 border border-neutral-700 rounded px-3 py-2 text-sm font-mono text-amber-400 focus:outline-none focus:border-amber-500 placeholder:text-neutral-500" disabled>
                <button id="load-url-btn" class="btn btn-sm px-3" disabled>TUNE</button>
            </div>
            <div class="flex gap-2 mt-3 pt-3 border-t border-neutral-700/50">
                <span class="text-xs font-mono text-neutral-400 self-center">CH:</span>
                <button class="btn btn-sm flex-1 channel-btn" data-url="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" disabled>1</button>
                <button class="btn btn-sm flex-1 channel-btn" data-url="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4" disabled>2</button>
                <button class="btn btn-sm flex-1 channel-btn" data-url="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4" disabled>3</button>
                <button id="test-pattern-btn" class="btn btn-sm flex-1 channel-btn" title="Test Pattern" disabled>TEST</button>
            </div>
            <!-- Test pattern type selector -->
            <div id="test-pattern-type" class="control-group mt-2 pt-2 border-t border-neutral-700/50">
                <label class="control-label">Pattern Type</label>
                <div class="flex flex-col gap-1">
                    <label class="radio-label"><input type="radio" name="test-pattern" value="0" checked class="accent-amber-500" disabled>SMPTE Color Bars</label>
                    <label class="radio-label"><input type="radio" name="test-pattern" value="1" class="accent-amber-500" disabled>Multiburst</label>
                    <label class="radio-label"><input type="radio" name="test-pattern" value="2" class="accent-amber-500" disabled>Crosshatch / Grid</label>
                    <label class="radio-label"><input type="radio" name="test-pattern" value="3" class="accent-amber-500" disabled>Grayscale Ramp</label>
                </div>
            </div>
        </div>

        <!-- Signal Quality -->
        <div class="panel-section">
            <h2 class="panel-header">Signal Quality</h2>
            <div class="flex flex-col gap-4">
                <div class="control-group">
                    <label class="control-label">Signal Type</label>
                    <div class="flex flex-col gap-1">
                        <label class="radio-label"><input type="radio" name="signal-type" value="0" checked class="accent-amber-500" disabled>RGB</label>
                        <label class="radio-label"><input type="radio" name="signal-type" value="1" class="accent-amber-500" disabled>S-Video</label>
                        <label class="radio-label"><input type="radio" name="signal-type" value="2" class="accent-amber-500" disabled>Composite</label>
                        <label class="radio-label"><input type="radio" name="signal-type" value="3" class="accent-amber-500" disabled>RF (Antenna)</label>
                    </div>
                </div>
                <div class="control-group">
                    <label class="control-label">Signal Strength</label>
                    <input type="range" id="signal-range"   min="0.7" max="1.0" step="0.01" value="1.0" disabled>
                </div>
                <div class="control-group">
                    <label class="control-label">Ghosting</label>
                    <input type="range" id="ghost-range"    min="0.0" max="0.1" step="0.005" value="0.0" disabled>
                </div>
                <div class="control-group">
                    <label class="control-label">Compression</label>
                    <input type="range" id="compress-range" min="0.0" max="0.9" step="0.01"  value="0.0" disabled>
                </div>
                <div class="control-group">
                    <label class="control-label">H-Sync Jitter</label>
                    <input type="range" id="jitter-range"   min="0.0" max="0.005" step="0.0002" value="0.0" disabled>
                </div>
            </div>
        </div>

        <!-- Electron Beam -->
        <div id="physics-controls-panel" class="panel-section transition-opacity duration-300">
            <h2 class="panel-header">Electron Beam</h2>
            <div class="flex flex-col gap-4">
                <div class="control-group">
                    <label class="control-label">Phosphor Persistence</label>
                    <input type="range" id="decay-range"    min="0.8" max="0.995" step="0.002" value="0.94" disabled>
                </div>
                <div class="control-group">
                    <label class="control-label">Beam Glow</label>
                    <input type="range" id="glow-range"     min="0.5" max="4.0"   step="0.1"   value="1.3"  disabled>
                </div>
                <div class="control-group">
                    <label class="control-label">Slow-Mo Beam</label>
                    <label class="toggle-label">
                        <input type="checkbox" id="slow-beam-toggle" disabled>
                        <div class="toggle-track"></div>
                    </label>
                </div>
            </div>
        </div>

        <!-- Display Output -->
        <div class="panel-section">
            <h2 class="panel-header">Display Output</h2>
            <div class="control-group mb-4">
                <label class="control-label">CRT Emulation</label>
                <label class="toggle-label">
                    <input type="checkbox" id="crt-on-toggle" checked disabled>
                    <div class="toggle-track"></div>
                    <span class="ml-3 text-sm font-medium text-neutral-300 font-mono">BYPASS</span>
                </label>
            </div>
            <div id="display-controls" class="flex flex-col gap-4 transition-opacity duration-300">
                <div class="control-group">
                    <label class="control-label">Bloom</label>
                    <input type="range" id="bloom-range"   min="0.0" max="1.0" step="0.05" value="0.4" disabled>
                </div>
                <div class="control-group">
                    <label class="control-label">Screen Curvature</label>
                    <input type="range" id="curve-range"   min="0.0" max="0.4" step="0.01"  value="0.2" disabled>
                </div>
                <div class="control-group">
                    <label class="control-label">Convergence</label>
                    <input type="range" id="converge-range" min="0.0" max="0.01" step="0.0005" value="0.0" disabled>
                </div>
                <div class="control-group pt-2 border-t border-neutral-700/50">
                    <label class="control-label">Refresh Rate / BFI
                        <span id="hz-detected" class="text-neutral-500 font-mono text-xs ml-1"></span>
                    </label>
                    <div class="flex flex-col gap-1">
                        <label class="radio-label"><input type="radio" name="refresh" value="off"   checked class="accent-amber-500" disabled>60 Hz (No BFI)</label>
                        <label class="radio-label"><input type="radio" name="refresh" value="120bfi"       class="accent-amber-500" disabled>120 Hz BFI</label>
                        <label class="radio-label"><input type="radio" name="refresh" value="180bfi"       class="accent-amber-500" disabled>180 Hz BFI</label>
                        <label class="radio-label"><input type="radio" name="refresh" value="auto"         class="accent-amber-500" disabled>Auto (detected)</label>
                    </div>
                </div>
                <div class="control-group">
                    <label class="control-label">BFI Duty Cycle</label>
                    <input type="range" id="bfi-duty-range" min="0.1" max="1.0" step="0.05" value="0.5" disabled>
                </div>
                <div class="control-group pt-2 border-t border-neutral-700/50">
                    <label class="control-label">Scanline Mode</label>
                    <div class="flex gap-4">
                        <label class="toggle-label">
                            <input type="checkbox" id="res-240p-toggle" disabled>
                            <div class="toggle-track"></div>
                            <span class="ml-3 text-sm font-mono text-neutral-300">240p</span>
                        </label>
                        <label class="toggle-label">
                            <input type="checkbox" id="interlace-toggle" disabled>
                            <div class="toggle-track"></div>
                            <span class="ml-3 text-sm font-mono text-neutral-300">480i</span>
                        </label>
                    </div>
                </div>
                <div class="control-group pt-2 border-t border-neutral-700/50">
                    <label class="control-label">Phosphor Mask</label>
                    <div class="flex flex-col gap-1">
                        <label class="radio-label"><input type="radio" name="mask" value="1" checked class="accent-amber-500" disabled>Aperture Grille</label>
                        <label class="radio-label"><input type="radio" name="mask" value="2"       class="accent-amber-500" disabled>Shadow Mask</label>
                        <label class="radio-label"><input type="radio" name="mask" value="3"       class="accent-amber-500" disabled>Slot Mask</label>
                    </div>
                </div>
                <div class="control-group pt-2 border-t border-neutral-700/50">
                    <label class="control-label">Screen Share Crop</label>
                    <label class="toggle-label">
                        <input type="checkbox" id="crop-43-toggle" disabled>
                        <div class="toggle-track"></div>
                        <span class="ml-3 text-sm font-mono text-neutral-300">4:3 CROP</span>
                    </label>
                </div>
                <div class="control-group pt-2 border-t border-neutral-700/50">
                    <label class="control-label">Degauss</label>
                    <button id="degauss-btn" class="btn btn-sm px-3" disabled>DEGAUSS</button>
                </div>
            </div>
        </div>

        <!-- Hardware Faults -->
        <div class="panel-section">
            <h2 class="panel-header">Hardware Faults</h2>
            <div class="flex flex-col gap-4">
                <div class="control-group">
                    <label class="control-label">Vertical Hold</label>
                    <input type="range" id="vhold-range"  min="0.0" max="1.0" step="0.005" value="0.5" disabled>
                </div>
                <div class="control-group">
                    <label class="control-label">Horizontal Hold (Tint)</label>
                    <input type="range" id="hhold-range"  min="-0.5" max="0.5" step="0.01" value="0.0" disabled>
                </div>
                <div class="control-group">
                    <label class="control-label">Failing Color Guns</label>
                    <div class="flex gap-4">
                        <label class="toggle-label">
                            <input type="checkbox" id="weak-red-toggle"   disabled>
                            <div class="toggle-track"></div>
                            <span class="ml-2 text-sm font-mono text-red-400">R</span>
                        </label>
                        <label class="toggle-label">
                            <input type="checkbox" id="weak-green-toggle" disabled>
                            <div class="toggle-track"></div>
                            <span class="ml-2 text-sm font-mono text-green-400">G</span>
                        </label>
                        <label class="toggle-label">
                            <input type="checkbox" id="weak-blue-toggle"  disabled>
                            <div class="toggle-track"></div>
                            <span class="ml-2 text-sm font-mono text-blue-400">B</span>
                        </label>
                    </div>
                </div>
                <div class="control-group">
                    <label class="control-label">VCR Mode</label>
                    <label class="toggle-label">
                        <input type="checkbox" id="vcr-mode-toggle" disabled>
                        <div class="toggle-track"></div>
                    </label>
                </div>
                <div class="control-group">
                    <label class="control-label">VCR Tracking</label>
                    <button id="tracking-btn" class="btn btn-sm px-3" disabled>ADJUST</button>
                </div>
                <div class="control-group">
                    <label class="control-label">Screen Burn-In</label>
                    <input type="range" id="burn-in-range" min="0.0" max="1.0" step="0.01" value="0.0" disabled>
                </div>
                <label class="btn btn-sm cursor-pointer text-center" title="Upload Burn-In Image">
                    <input type="file" id="burn-in-uploader" accept="image/*" class="hidden" disabled>
                    UPLOAD BURN-IN
                </label>
            </div>
        </div>

        <!-- Environment -->
        <div class="panel-section">
            <h2 class="panel-header">Environment</h2>
            <div class="flex flex-col gap-1">
                <label class="radio-label"><input type="radio" name="environment" value="studio" checked class="accent-amber-500" disabled>Studio</label>
                <label class="radio-label"><input type="radio" name="environment" value="den"          class="accent-amber-500" disabled>80s Den</label>
                <label class="radio-label"><input type="radio" name="environment" value="arcade"       class="accent-amber-500" disabled>Arcade</label>
            </div>
        </div>

        <!-- Keyboard hints -->
        <div class="text-xs font-mono text-neutral-600 leading-relaxed px-1">
            <span class="text-neutral-500">Shortcuts:</span>
            P=Power · O=Overlay · M=Menu · Space=Play
            <br>
            F=Theatre · C=CRT-FS · T=Test · D=Degauss
            <br>
            ↑↓ OSD nav · ←→ OSD value · 1/2/3=CH
        </div>

    </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Overlay HUD (shown when in overlay mode) -->
<div id="overlay-hud">
    <span class="overlay-hud-label">⬡ CRT OVERLAY</span>
    <div class="overlay-hud-divider"></div>
    <button id="overlay-cycle-signal" class="overlay-hud-btn" title="Cycle Signal Type">SIG: RGB</button>
    <button id="overlay-crt-btn" class="overlay-hud-btn" title="Toggle CRT Effects">CRT: ON</button>
    <button id="overlay-decay-btn" class="overlay-hud-btn" title="Toggle Phosphor Persistence">PHOS: ON</button>
    <div class="overlay-hud-divider"></div>
    <button id="overlay-exit-btn" class="overlay-hud-btn overlay-hud-exit" title="Exit Overlay Mode (O)">✕ EXIT</button>
</div>

<script src="app.js"></script>
</body>
</html>
